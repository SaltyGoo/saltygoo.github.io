# Jargon

tip_diesize:
  title: "Die Size"
  text: "D4 > D6 > D8 > D10 > D12 > D20"

# Base Rules

tip_carousing:
  title: "Carousing"
  text: "When you are in a town and spend loot between adventures. See Base Rules."

tip_follower:
  title: "Follower"
  text: "A side character. 1D6 in each stat. Takes a Psyche Slot to bring with you. See Base Rules."

tip_psyche:
  title: "Psyche"
  text: "A mental inventory with as many slots as twice your Willpower. You become Dazed if full."

tip_resting:
  title: "Rest"
  text: "Resting takes 6 hours and requires shelter, heat and 1 ration for the team."

tip_skill:
  title: "Skills"
  text: "A skill is an experience stored in your Psyche. All rolls that can be related to a skill you have become easier."
  
tip_trauma:
  title: "Trauma"
  text: "Traumas take psyche slots. You have disadvantage against what caused it."
  
tip_watches:
  title: "Watch"
  text: "A day is divided in 4 six-hours watches: Morning, Day, Evening, and Night."

# Statuses

tip_status_exhausted:
  title: "Exhausted"
  text: "You can act OR move on your turn."

tip_status_frightened:
  title: "Frigthened"
  text: "You cannot interact with what frigthened you until you have spent a full turn without seeing it. Roll a D6: 1) drop what you're holding; 2) scream; 3) fall; 4) grapple the closest thing; 5) skip your turn; 6) run away."
  
tip_status_intoxicated:
  title: "Intoxicated"
  text: "You have disadvantage on all your actions. Specific poisons have unique effects."

# Other

tip_silverweapon:
  title: "Silvered"
  text: "Ignore the resistances of undead creatures and shapeshifters."
 

